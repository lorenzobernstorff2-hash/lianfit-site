# HTML nunca fica preso no cache do navegador (sem isto, quem já visitou seguia vendo a
# página antiga depois de um deploy); imagens, fontes e SVGs podem ficar um dia.
map $sent_http_content_type $cache_regra {
    "~^text/html"  "no-cache";
    default        "public, max-age=86400";
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    add_header Cache-Control $cache_regra always;

    location / {
        try_files $uri $uri/ =404;
    }
}
